<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Cadet Shield -->
  <g id="badge-cadet" transform="translate(50, 40)">
    <circle cx="60" cy="60" r="50" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="3" />
    <polygon points="60,25 90,45 80,85 60,95 40,85 30,45" fill="#00F0FF" fill-opacity="0.3" stroke="#00F0FF" stroke-width="2" />
    <text x="60" y="130" fill="#00F0FF" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">ক্যাডেট পদক</text>
  </g>

  <!-- Astronaut Shield -->
  <g id="badge-astronaut" transform="translate(240, 40)">
    <circle cx="60" cy="60" r="50" fill="#00E676" fill-opacity="0.15" stroke="#00E676" stroke-width="3" />
    <polygon points="60,20 100,50 60,80 20,50" fill="#00E676" fill-opacity="0.4" stroke="#00E676" stroke-width="2" />
    <circle cx="60" cy="50" r="14" fill="#FFD700" />
    <text x="60" y="130" fill="#00E676" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">মহাকাশচারী পদক</text>
  </g>

  <!-- Pilot Badge -->
  <g id="badge-pilot" transform="translate(430, 40)">
    <circle cx="60" cy="60" r="50" fill="#FF5252" fill-opacity="0.15" stroke="#FF5252" stroke-width="3" />
    <path d="M 60,30 L 75,60 L 95,65 L 75,75 L 60,95 L 45,75 L 25,65 L 45,60 Z" fill="#FF5252" />
    <text x="60" y="130" fill="#FF5252" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">রকেট পাইলট</text>
  </g>

  <!-- Astronomer Badge -->
  <g id="badge-astronomer" transform="translate(50, 220)">
    <circle cx="60" cy="60" r="50" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="3" />
    <circle cx="60" cy="60" r="22" fill="none" stroke="#00F0FF" stroke-width="2" stroke-dasharray="4,3" />
    <polygon points="60,38 64,52 78,56 64,60 60,74 56,60 42,56 56,52" fill="#00F0FF" />
    <text x="60" y="130" fill="#00F0FF" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">তারা সন্ধানী</text>
  </g>

  <!-- Engineer Badge -->
  <g id="badge-engineer" transform="translate(240, 220)">
    <circle cx="60" cy="60" r="50" fill="#FFB800" fill-opacity="0.15" stroke="#FFB800" stroke-width="3" />
    <circle cx="60" cy="60" r="16" fill="none" stroke="#FFB800" stroke-width="4" stroke-dasharray="8,4" />
    <circle cx="60" cy="60" r="8" fill="#FFB800" />
    <text x="60" y="130" fill="#FFB800" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">স্পেস ইঞ্জিনিয়ার</text>
  </g>

  <!-- Explorer Badge -->
  <g id="badge-explorer" transform="translate(430, 220)">
    <circle cx="60" cy="60" r="50" fill="#E040FB" fill-opacity="0.15" stroke="#E040FB" stroke-width="3" />
    <circle cx="60" cy="60" r="24" fill="#E040FB" fill-opacity="0.3" stroke="#E040FB" stroke-width="2" />
    <ellipse cx="60" cy="60" rx="34" ry="10" fill="none" stroke="#E040FB" stroke-width="2" transform="rotate(-25 60 60)" />
    <text x="60" y="130" fill="#E040FB" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">এলিয়েন অভিযাত্রী</text>
  </g>
</svg>
