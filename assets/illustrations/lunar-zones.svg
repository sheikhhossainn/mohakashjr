<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="moonDisc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.8" />
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFB800" flood-opacity="0.8" />
    </filter>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00E676" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Space Background -->
  <rect width="600" height="400" fill="#0B0F19" rx="16" />

  <!-- Full Moon Map Sphere -->
  <circle cx="300" cy="200" r="150" fill="url(#moonDisc)" stroke="#334155" stroke-width="3" />

  <!-- Lunar Maria (Dark Patches) -->
  <path d="M 230,140 Q 270,120 310,150 Q 320,180 280,190 Q 230,170 230,140 Z" fill="#475569" opacity="0.6" />
  <path d="M 330,160 Q 380,150 400,190 Q 370,220 340,200 Z" fill="#475569" opacity="0.6" />
  <path d="M 200,200 Q 250,220 240,260 Q 190,250 200,200 Z" fill="#475569" opacity="0.5" />

  <!-- Zone 1: Mare Tranquillitatis (Apollo 11) - Flat & Safe -->
  <g id="zone-tranquillity" filter="url(#glowEmerald)">
    <circle cx="360" cy="180" r="14" fill="#00E676" fill-opacity="0.3" stroke="#00E676" stroke-width="2.5" />
    <circle cx="360" cy="180" r="6" fill="#00E676" />
    <line x1="360" y1="166" x2="360" y2="130" stroke="#00E676" stroke-width="2" />
    <rect x="300" y="105" width="120" height="24" rx="6" fill="#0E1236" stroke="#00E676" stroke-width="1.5" />
    <text x="360" y="121" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">শান্ত সাগর (Apollo 11)</text>
  </g>

  <!-- Zone 2: Shackleton Crater (South Pole) - Water Ice & High Risk -->
  <g id="zone-shackleton" filter="url(#glowCyan)">
    <circle cx="300" cy="325" r="14" fill="#00F0FF" fill-opacity="0.3" stroke="#00F0FF" stroke-width="2.5" />
    <circle cx="300" cy="325" r="6" fill="#00F0FF" />
    <line x1="300" y1="339" x2="300" y2="360" stroke="#00F0FF" stroke-width="2" />
    <rect x="225" y="360" width="150" height="24" rx="6" fill="#0E1236" stroke="#00F0FF" stroke-width="1.5" />
    <text x="300" y="376" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">শ্যাকলটন খাদ (বরফ ও পানি)</text>
  </g>

  <!-- Zone 3: Oceanus Procellarum (Ocean of Storms) - Solar Power -->
  <g id="zone-procellarum" filter="url(#glowGold)">
    <circle cx="210" cy="170" r="14" fill="#FFB800" fill-opacity="0.3" stroke="#FFB800" stroke-width="2.5" />
    <circle cx="210" cy="170" r="6" fill="#FFB800" />
    <line x1="210" y1="156" x2="210" y2="120" stroke="#FFB800" stroke-width="2" />
    <rect x="140" y="95" width="140" height="24" rx="6" fill="#0E1236" stroke="#FFB800" stroke-width="1.5" />
    <text x="210" y="111" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">ঝড়ের মহাসাগর (সৌরশক্তি)</text>
  </g>
</svg>
